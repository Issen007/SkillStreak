name: CI

on:
  pull_request:
    branches: [main, review]
  push:
    branches: [main, review]
  # Lets a manual re-run happen without needing an empty/throwaway commit
  # just to get push: to fire again — came up repeatedly while chasing a
  # sequence of CI/deploy-only fixes (no code change, e.g. a GitHub secret
  # update) where the only way to re-trigger was a new push. `gh run rerun`
  # doesn't cover this either without an `actions:write`-scoped token.
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend lint, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Phase 1's e2e suite exercises real Postgres/Redis writes (streak/team-
    # pool transactions), not just a stub — so CI needs the same two
    # datastores docker-compose.yml provides locally, as service containers.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Fas 3's video-clip e2e suite exercises a real MinIO instance (the
    # object-storage/metadata-stripping path is the whole point of that
    # suite, not something to stub out) — started as a manual `docker run`
    # step below, not a `services:` entry like postgres/redis above.
    #
    # HISTORY: this originally used `bitnami/minio:latest` as a `services:`
    # entry, since GitHub Actions job "services" can't override a
    # container's command/args and bitnami's image was designed to boot the
    # server from env vars alone. That broke every CI run once Bitnami
    # pulled its free-tier images off Docker Hub (`bitnami/minio` now
    # resolves zero tags at all — confirmed via Docker Hub's own API, not
    # just this run's failure). The official `minio/minio` image doesn't
    # have the same env-vars-only boot behavior (its default `Cmd` is bare
    # `["minio"]`, not `["minio","server","/data"]` — confirmed by pulling
    # and inspecting it directly), so it can't be a drop-in `services:`
    # replacement either. Running it as an explicit step instead sidesteps
    # the command-override limitation entirely: `docker run` can pass
    # `server /data` directly, the same command k8s/minio-deployment.yaml
    # and docker-compose.yml already use for the official image.
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app_dev
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-test-secret
      # A real, valid 32-byte base64 key (CI-only, not a real secret) --
      # common/crypto/pii-encryption.util.ts throws on anything that
      # doesn't decode to exactly 32 bytes, so a placeholder string like
      # JWT_SECRET's above won't work here.
      PII_ENCRYPTION_KEY: Y2ktb25seS10ZXN0LWtleS0zMi1ieXRlcy1sb25nISE=
      # docs/adr/0023-pt-role-and-staff-sso-rbac.md Part B — required by
      # env.validation.ts (same posture as JWT_SECRET above), but no OAuth
      # client credentials are set here: no e2e test attempts a real
      # provider round trip, per that ADR's own "don't attempt live
      # three-provider OAuth testing" decision — see StaffAuthService's
      # unit tests instead, which mock the OIDC client entirely.
      STAFF_JWT_SECRET: ci-only-test-secret
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ci-minio-user
      MINIO_SECRET_KEY: ci-minio-password
      MINIO_BUCKET: clips
    steps:
      - uses: actions/checkout@v4

      # docs/adr/0010-video-storage-and-serving.md's metadata-stripping
      # remux (VideoProcessingService) needs both ffmpeg and ffprobe on
      # PATH for its own e2e coverage to mean anything. This used to be a
      # bare "assume ubuntu-latest ships it, just verify" check — that
      # assumption was wrong on a real run (command -v failed for both
      # binaries, confirmed live), so this now actually installs it rather
      # than hoping it's already there. `working-directory: .` overrides
      # the job's `backend`-scoped default, since apt-get has no
      # dependency on being inside that directory.
      - name: Install ffmpeg
        working-directory: .
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          command -v ffmpeg && command -v ffprobe && ffmpeg -version | head -1

      - name: Start MinIO (official image, manual run — see comment above)
        run: |
          docker run -d --name minio-ci \
            -e MINIO_ROOT_USER=ci-minio-user \
            -e MINIO_ROOT_PASSWORD=ci-minio-password \
            -p 9000:9000 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become healthy in time"
          docker logs minio-ci
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          # pnpm/action-setup auto-detects the version from a root
          # package.json's "packageManager" field — but our Node project
          # lives in backend/, not the repo root (defaults.run.working-directory
          # only applies to `run:` steps, not `uses:` actions), so it can't
          # auto-detect here. Pinned to match backend/package.json's
          # packageManager pin.
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Run migrations
        run: pnpm run migration:run

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        run: pnpm run test:e2e

  mobile-typecheck:
    name: Mobile typecheck + expo-doctor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    # mobile/README.md names these two as "the quick sanity checks worth
    # running before calling a change done" — every prior phase's
    # frontend-developer pass has run them by hand, but nothing enforced it
    # in CI, so a change that skipped that manual step (or a non-agent PR)
    # could merge with a broken build unnoticed. This job automates exactly
    # those two checks, nothing more — it doesn't attempt a simulator/device
    # run (none exists in CI any more than in this project's own dev
    # sandbox, per mobile/README.md's own noted gap).
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # mobile/package.json pins a different pnpm version than
          # backend/package.json — pnpm/action-setup can't auto-detect a
          # "packageManager" field outside the repo root (defaults.run
          # .working-directory only applies to `run:` steps), so this is
          # pinned to match mobile/package.json's own pin explicitly,
          # mirroring the backend-test job's identical comment/pattern.
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: expo-doctor
        run: npx expo-doctor

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t skillstreak-api:ci ./backend

      # site/Dockerfile's context is the repo root (needs mobile/ + site/
      # together, see that file's header comment) — not ./site like the
      # backend build. EXPO_PUBLIC_API_URL and API_BASE_URL are both baked
      # in at build time (the former for the Expo web export, the latter
      # for site/index.html's own embedded onboarding widget — see that
      # Dockerfile's comment on why a static HTML file needs a build-time
      # substitution the same way Expo needs a build-time env var), so CI
      # uses the same real domain the deploy job pushes with for both
      # (see k8s/configmap.yaml's APP_PUBLIC_URL comment). Missing
      # API_BASE_URL here would silently ship the Dockerfile's own
      # localhost default to every real deploy — confirmed to actually
      # happen once, caught in review, not a hypothetical.
      - name: Build site image
        run: |
          docker build -f site/Dockerfile \
            --build-arg EXPO_PUBLIC_API_URL=https://api.skillstreak.xyz \
            --build-arg API_BASE_URL=https://api.skillstreak.xyz \
            --build-arg TRY_IT_URL=https://try.skillstreak.xyz \
            --build-arg EXPO_PUBLIC_JOIN_URL=https://skillstreak.xyz \
            -t skillstreak-site:ci .

  clip-tagger:
    name: clip-tagger lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/clip-tagger
    # Runs on every PR like the other test jobs, and shares no step with
    # `deploy`, `release` or `internal-images` (Decision 13) — the GPU
    # cluster is a different cluster with a different credential, and a job
    # that could touch both is the 2026-07-30 wrong-image incident waiting
    # to happen in a new place.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"

      # Deliberately WITHOUT --extra model: torch is ~2.5 GB and the tests
      # exercise every path except inference, via the stub backend. Model
      # accuracy is not a CI question — it is measured on the real hardware
      # by eval/run_fixtures.py against a fixture set that contains no user
      # of this app.
      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src eval tests

      - name: Test
        run: uv run pytest -q

      # Proves the service actually starts and answers, not just that its
      # units pass. The stub is explicitly selected; a build that could
      # serve fake scores without someone typing `stub` is the failure this
      # check exists to make impossible to reach by accident.
      - name: Smoke test the running service
        env:
          CLIP_TAGGER_BACKEND: stub
          CLIP_TAGGER_TOKEN: ci-token-not-a-real-secret
          SERVICE_VERSION: ci-${{ github.sha }}
        run: |
          uv run uvicorn clip_tagger.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl -fsS localhost:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS localhost:8000/health | tee /tmp/health.json
          grep -q '"modelId": *"stub"' /tmp/health.json

          # An unauthenticated call must be refused. This is the one
          # property that, if it regressed, would expose the cluster's GPUs
          # to anyone who found the hostname.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            localhost:8000/v1/analyse-frames -F 'meta={"requestId":"x"}')
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }

  compose-smoke-test:
    name: docker-compose smoke test
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env file
        run: cp .env.example .env

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for API health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose logs
          exit 1

      - name: Tear down stack
        if: always()
        run: docker compose down -v
  clip-tagger-image:
    name: Build and Push clip-tagger Image
    # Only on main, and only after its own tests pass. Shares no step with
    # `deploy`, `release` or `internal-images` (Decision 13): the GPU
    # cluster is a different cluster with a different credential, and a job
    # able to touch both is the 2026-07-30 wrong-image incident waiting to
    # happen somewhere new.
    #
    # Not wired into any deploy. Nothing applies this image anywhere yet,
    # because the GPU cluster has no route (see k8s-ai/README.md). Building
    # it here means the image exists the moment a route does, rather than
    # the route landing and the image then being the blocker.
    needs: [clip-tagger]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Downcase repository owner for Docker
        run: echo "TAGGER_IMAGE=ghcr.io/${OWNER,,}/skillstreak-clip-tagger" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SHA-tagged, never `latest`, so a running pod's /health can always
      # be traced back to a commit. One image, no per-environment variants:
      # it holds no URL of ours and serves no HTML, so CLAUDE.md's
      # per-environment image rule does not apply (Decision 9).
      - name: Build and push
        run: |
          docker build \
            --build-arg SERVICE_VERSION="main-${GITHUB_SHA}" \
            -t "${TAGGER_IMAGE}:main-${GITHUB_SHA}" \
            ./ai/clip-tagger
          docker push "${TAGGER_IMAGE}:main-${GITHUB_SHA}"

      # The image bakes model weights and must therefore be able to load
      # them with no network, since egress is denied in the cluster. A pod
      # that only discovers this at rollout presents as an unschedulable
      # or perpetually-unready deploy, which is a much worse place to find
      # out than here.
      - name: Verify the pushed image starts offline and reports itself
        run: |
          docker run --rm -d --name tagger-verify --network none \
            -e CLIP_TAGGER_TOKEN=verify-token-not-a-real-secret \
            -p 8000:8000 "${TAGGER_IMAGE}:main-${GITHUB_SHA}" || true
          docker run --rm --network container:tagger-verify curlimages/curl:8.11.0 \
            sh -c 'for i in $(seq 1 60); do curl -fsS localhost:8000/health && exit 0; sleep 2; done; exit 1' \
            | tee /tmp/health.json
          grep -q "\"modelId\"" /tmp/health.json
          # It must NOT claim to be the stub: a real image serving hashed
          # scores would be invisible without this check.
          if grep -q '"modelId": *"stub"' /tmp/health.json; then
            echo "Built image reports the stub backend — refusing to publish it as real."
            exit 1
          fi
          docker rm -f tagger-verify

  deploy:
    name: Deploy to Kubernetes Cluster
    runs-on: ubuntu-latest
    # 1. ONLY run this job if the tests AND the smoke tests pass perfectly
    needs: [backend-test, compose-smoke-test]
    # 2. ONLY run this job if the code is being merged/pushed into main (not
    # on open PRs), OR a manual workflow_dispatch re-run — both only ever
    # target main (workflow_dispatch has no branches: filter of its own, so
    # github.ref is checked the same way for both event types).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 1. New Step: Force your username to lowercase so Docker registry doesn't crash
      - name: Downcase repository owner for Docker
        run: |
          echo "LOWER_IMAGE=ghcr.io/${OWNER,,}/skillstreak-api" >> $GITHUB_ENV
          echo "LOWER_SITE_IMAGE=ghcr.io/${OWNER,,}/skillstreak-site" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      # 2. Inject Secrets securely — one GitHub secret per key (matching
      # KUBE_TOKEN/KUBE_URL), not a single opaque SKILLSTREAK_SECRET_YAML
      # blob. Rotating any one credential (e.g. a routine JWT_SECRET
      # rotation) now only needs `gh secret set THAT_KEY`, not a full
      # rewrite-and-repaste of every value at once. Adding a new required
      # key (see backend/src/config/env.validation.ts) means: add it as a
      # GitHub secret, add it to both the env: block and the
      # --from-literal list below, and to k8s/secret.yaml.example's
      # stringData for local/manual setups.
      - name: Inject Production Secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_CLIPS_ACCESS_KEY: ${{ secrets.MINIO_CLIPS_ACCESS_KEY }}
          MINIO_CLIPS_SECRET_KEY: ${{ secrets.MINIO_CLIPS_SECRET_KEY }}
          # docs/adr/0023-pt-role-and-staff-sso-rbac.md Part B.
          # STAFF_JWT_SECRET is REQUIRED for the api Pod to boot at all
          # (env.validation.ts) — this GitHub secret must be set (e.g.
          # `gh secret set STAFF_JWT_SECRET`) before this merges to `main`,
          # or the next production deploy will crash-loop on boot with an
          # "Invalid environment configuration" error, the exact
          # missing-live-Secret-key failure mode this project has hit
          # before. The five OAuth-credential secrets below may stay unset
          # until the project owner registers each real OAuth application
          # (Decision B6) — k8s/api-deployment.yaml's `optional: true` on
          # those specific keys means an empty value here is a safe,
          # expected interim state, not a boot failure.
          STAFF_JWT_SECRET: ${{ secrets.STAFF_JWT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_CLIENT_SECRET: ${{ secrets.MICROSOFT_OAUTH_CLIENT_SECRET }}
          APPLE_OAUTH_CLIENT_ID: ${{ secrets.APPLE_OAUTH_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          # Fas 5 (docs/adr/0020-usage-analytics-product-metrics.md
          # Decision 5) — the monthly aggregate usage report's recipient.
          # Safe to leave unset: k8s/api-deployment.yaml marks this key
          # `optional: true` and the job no-ops with a log line until it has
          # a real address, so an unset GitHub secret (which arrives here as
          # an empty string) is an expected interim state, not a boot
          # failure.
          USAGE_REPORT_RECIPIENT_EMAIL: ${{ secrets.USAGE_REPORT_RECIPIENT_EMAIL }}
        run: |
          kubectl create secret generic skillstreak-secret \
            --namespace skillstreak \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=PII_ENCRYPTION_KEY="$PII_ENCRYPTION_KEY" \
            --from-literal=SMTP_USER="$SMTP_USER" \
            --from-literal=SMTP_PASSWORD="$SMTP_PASSWORD" \
            --from-literal=MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            --from-literal=MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            --from-literal=MINIO_CLIPS_ACCESS_KEY="$MINIO_CLIPS_ACCESS_KEY" \
            --from-literal=MINIO_CLIPS_SECRET_KEY="$MINIO_CLIPS_SECRET_KEY" \
            --from-literal=STAFF_JWT_SECRET="$STAFF_JWT_SECRET" \
            --from-literal=ADMIN_EMAILS="$ADMIN_EMAILS" \
            --from-literal=GOOGLE_OAUTH_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID" \
            --from-literal=GOOGLE_OAUTH_CLIENT_SECRET="$GOOGLE_OAUTH_CLIENT_SECRET" \
            --from-literal=MICROSOFT_OAUTH_CLIENT_ID="$MICROSOFT_OAUTH_CLIENT_ID" \
            --from-literal=MICROSOFT_OAUTH_CLIENT_SECRET="$MICROSOFT_OAUTH_CLIENT_SECRET" \
            --from-literal=APPLE_OAUTH_CLIENT_ID="$APPLE_OAUTH_CLIENT_ID" \
            --from-literal=APPLE_TEAM_ID="$APPLE_TEAM_ID" \
            --from-literal=APPLE_KEY_ID="$APPLE_KEY_ID" \
            --from-literal=APPLE_PRIVATE_KEY="$APPLE_PRIVATE_KEY" \
            --from-literal=USAGE_REPORT_RECIPIENT_EMAIL="$USAGE_REPORT_RECIPIENT_EMAIL" \
            --dry-run=client -o yaml > k8s/secret.yaml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Build using the new lowercase environment variable
      - name: Build and Push Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            APP_VERSION=main-${{ github.sha }}
          tags: |
            ${{ env.LOWER_IMAGE }}:${{ github.sha }}

      # site/Dockerfile's build context is the repo root, not ./site (see
      # that file's header comment — it needs mobile/ + site/ together).
      # EXPO_PUBLIC_API_URL and API_BASE_URL are both baked in at build
      # time and must point at wherever the api is actually reachable —
      # the latter feeds site/index.html's own embedded onboarding widget,
      # not just the Expo web export. Real public domain (skillstreak.xyz)
      # via skillstreak-gateway's TLS listeners — see
      # k8s/configmap.yaml's APP_PUBLIC_URL comment.
      - name: Build and Push Site Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./site/Dockerfile
          push: true
          build-args: |
            EXPO_PUBLIC_API_URL=https://api.skillstreak.xyz
            API_BASE_URL=https://api.skillstreak.xyz
            TRY_IT_URL=https://try.skillstreak.xyz
            EXPO_PUBLIC_JOIN_URL=https://skillstreak.xyz
            EXPO_PUBLIC_APP_VERSION=main-${{ github.sha }}
          tags: |
            ${{ env.LOWER_SITE_IMAGE }}:${{ github.sha }}

      # 4. Update the manifests using native Bash environment variables
      - name: Update Deployment Image Tags
        run: |
          # By using $LOWER_IMAGE/$LOWER_SITE_IMAGE and $GITHUB_SHA, Bash reads the variables directly
          FULL_IMAGE_URL="${LOWER_IMAGE}:${GITHUB_SHA}"
          FULL_SITE_IMAGE_URL="${LOWER_SITE_IMAGE}:${GITHUB_SHA}"
          echo "Replacing placeholder with: $FULL_IMAGE_URL"
          echo "Replacing placeholder with: $FULL_SITE_IMAGE_URL"
          # k8s/api-deployment.yaml's and k8s/site-deployment.yaml's actual
          # placeholders are a bare `image:` (see each file's own header
          # comment) — NOT the literal string "image: skillstreak-api:latest"
          # this used to look for, which never matched anything and left the
          # field empty, so every deploy failed with
          # "spec.template.spec.containers[0].image: Required value". Match
          # any `image:` line instead, and verify the substitution actually
          # landed so a future mismatch fails loudly here instead of three
          # steps later as a confusing k8s validation error.
          sed -i "s|^\([[:space:]]*\)image:.*|\1image: ${FULL_IMAGE_URL}|" k8s/api-deployment.yaml
          grep -qF "image: ${FULL_IMAGE_URL}" k8s/api-deployment.yaml || {
            echo "::error::Failed to set the image on k8s/api-deployment.yaml — placeholder pattern didn't match."
            exit 1
          }
          sed -i "s|^\([[:space:]]*\)image:.*|\1image: ${FULL_SITE_IMAGE_URL}|" k8s/site-deployment.yaml
          grep -qF "image: ${FULL_SITE_IMAGE_URL}" k8s/site-deployment.yaml || {
            echo "::error::Failed to set the image on k8s/site-deployment.yaml — placeholder pattern didn't match."
            exit 1
          }

      - name: Set Kubernetes Context
        run: |
          # 1. Register your cluster URL and skip the problematic X509 certificate check
          kubectl config set-cluster skillstreak-cluster --server=${{ secrets.KUBE_URL }} --insecure-skip-tls-verify=true
          
          # 2. Assign your secure robot token
          kubectl config set-credentials github-actions-deployer --token=${{ secrets.KUBE_TOKEN }}
          
          # 3. Bind them together inside your specific namespace
          kubectl config set-context skillstreak-context --cluster=skillstreak-cluster --user=github-actions-deployer --namespace=skillstreak
          
          # 4. Activate the context
          kubectl config use-context skillstreak-context

      - name: Deploy Manifests
        run: |
          # cluster-issuer.yaml (ClusterIssuer, cluster-scoped) is
          # deliberately NOT applied here — github-actions-deployer is
          # scoped to the skillstreak namespace only (see temp/README.md's
          # description of its permissions) and can't manage cluster-scoped
          # resources. Apply that one manually, once, with a kubeconfig
          # that has broader rights (see k8s/README.md's deploy order).
          #
          # gateway.yaml is deliberately NOT applied here — its
          # GatewayClass is cluster-scoped (this deployer is namespace-only
          # by design), same posture as cluster-issuer.yaml. Apply it once
          # manually per k8s/README.md's deploy order. httproute.yaml and
          # certificate.yaml are both fully namespace-scoped and safe to
          # reapply every deploy, so they're included below — this is the
          # real external path now (skillstreak.xyz via
          # skillstreak-gateway), replacing the old ingress-nginx plan
          # that never had a working external path on this cluster.
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/postgres-pvc.yaml
          kubectl apply -f k8s/postgres-service.yaml
          kubectl apply -f k8s/redis-service.yaml
          # Fas 3 (docs/adr/0010-video-storage-and-serving.md) — MinIO gets
          # the identical Deployment+PVC+ClusterIP treatment as Postgres.
          kubectl apply -f k8s/minio-pvc.yaml
          kubectl apply -f k8s/minio-service.yaml
          kubectl apply -f k8s/api-service.yaml
          kubectl apply -f k8s/site-service.yaml
          kubectl apply -f k8s/httproute.yaml
          kubectl apply -f k8s/certificate.yaml
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/redis-deployment.yaml
          kubectl apply -f k8s/minio-deployment.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/site-deployment.yaml

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/postgres -n skillstreak
          kubectl rollout status deployment/redis -n skillstreak
          kubectl rollout status deployment/minio -n skillstreak
          kubectl rollout status deployment/api -n skillstreak
          kubectl rollout status deployment/site -n skillstreak

  deploy-ai:
    name: Deploy clip-tagger to the GPU Cluster
    # Same discipline as `deploy`, different cluster, and deliberately
    # sharing NO step with it: different kubeconfig secrets
    # (AI_KUBE_URL/AI_KUBE_TOKEN, never KUBE_*), a different namespace,
    # a different manifest directory, and a cluster-identity assertion
    # before anything is applied. ADR-0028 Decision 12's deploy safety, and
    # the direct lesson of the 2026-07-30 wrong-image incident: the way two
    # clusters get confused is a job that can reach both.
    needs: [clip-tagger-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skipped rather than failed when the GPU cluster's credentials are
      # not configured. This deploys an optional, advisory feature to a
      # cluster that may not be reachable from CI at all — turning that
      # into a red build on every merge would train everyone to ignore it.
      - name: Check whether the GPU cluster is configured
        id: configured
        run: |
          if [ -n "${{ secrets.AI_KUBE_URL }}" ] && [ -n "${{ secrets.AI_KUBE_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AI_KUBE_URL/AI_KUBE_TOKEN are not set; skipping the GPU cluster deploy."
          fi

      - name: Configure kubectl for the GPU cluster
        if: steps.configured.outputs.ready == 'true'
        run: |
          kubectl config set-cluster gpu --server="${{ secrets.AI_KUBE_URL }}" --insecure-skip-tls-verify=true
          kubectl config set-credentials gpu --token="${{ secrets.AI_KUBE_TOKEN }}"
          kubectl config set-context gpu --cluster=gpu --user=gpu --namespace=skillstreak-ai
          kubectl config use-context gpu

      # The deploy-time analogue of asking a running pod what it is. If
      # this ConfigMap says anything other than `skillstreak-gpu`, these
      # credentials point at the wrong cluster and nothing further runs.
      - name: Assert we are pointed at skillstreak-gpu
        if: steps.configured.outputs.ready == 'true'
        run: |
          actual=$(kubectl -n skillstreak-ai get configmap cluster-identity -o jsonpath='{.data.cluster}')
          echo "cluster-identity reports: $actual"
          if [ "$actual" != "skillstreak-gpu" ]; then
            echo "Refusing to apply: expected skillstreak-gpu, got '$actual'."
            exit 1
          fi

      - name: Apply the clip-tagger worker
        if: steps.configured.outputs.ready == 'true'
        run: |
          owner="${{ github.repository_owner }}"
          image="ghcr.io/${owner,,}/skillstreak-clip-tagger:main-${GITHUB_SHA}"
          sed "s|ghcr.io/issen007/skillstreak-clip-tagger:PLACEHOLDER_IMAGE_TAG|${image}|" \
            k8s-ai/clip-tagger.yaml | kubectl apply -f -
          kubectl -n skillstreak-ai rollout status deployment/clip-tagger --timeout=10m

      # The worker has no HTTP endpoint to probe (nothing listens, by
      # design), so "is it actually working" is answered by its own log
      # line rather than by a health check.
      - name: Show what the worker reports
        if: steps.configured.outputs.ready == 'true'
        run: |
          kubectl -n skillstreak-ai logs deployment/clip-tagger --tail=20 || true

  release:
    name: Version and Release
    runs-on: ubuntu-latest
    # Independent of the `deploy` job on purpose: versioning/publishing a
    # release shouldn't be blocked by the remote cluster's own deploy
    # flakiness (that cluster's rollout has its own history of issues,
    # unrelated to whether the code itself is good) — this job only needs
    # the code to be verified-good, not the remote cluster to be healthy.
    needs: [backend-test, compose-smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history to find the latest version

      # Cascading auto-versioning, per the project owner's spec
      # (2026-08-09): +0.0.1 each merge to main, and each component rolls
      # over at 9 into the next one up — v0.0.9 -> v0.1.0, v0.9.9 -> v1.0.0.
      #
      # NOTE this is deliberately NOT semver, which would go v0.0.9 ->
      # v0.0.10 and reserves major/minor bumps for compatibility meaning
      # rather than counting. It is a release counter in base 10, chosen
      # knowingly: it makes "how far along are we" readable at a glance,
      # at the cost of the version number carrying no compatibility
      # signal. Only the patch/minor rollover is capped at 9 — major keeps
      # counting normally, so v9.9.9 -> v10.0.0 rather than wrapping.
      - name: Compute next version
        id: version
        run: |
          git fetch --tags --quiet
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v0.0.1"
          else
            VERSION_NUMBERS="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION_NUMBERS" | cut -d. -f1)
            MINOR=$(echo "$VERSION_NUMBERS" | cut -d. -f2)
            PATCH=$(echo "$VERSION_NUMBERS" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            if [ "$PATCH" -gt 9 ]; then
              PATCH=0
              MINOR=$((MINOR + 1))
            fi
            if [ "$MINOR" -gt 9 ]; then
              MINOR=0
              MAJOR=$((MAJOR + 1))
            fi
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "Latest tag: ${LATEST_TAG:-none yet}, new tag: $NEW_TAG"
          echo "version=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push the version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Downcase repository owner for Docker
        run: |
          echo "LOWER_IMAGE=ghcr.io/${OWNER,,}/skillstreak-api" >> "$GITHUB_ENV"
          echo "LOWER_SITE_IMAGE=ghcr.io/${OWNER,,}/skillstreak-site" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilt here rather than re-tagging the `deploy` job's own image:
      # keeps this job fully independent (see the comment at the top of
      # this job) at the cost of one redundant build — a deliberate,
      # "boring and decoupled over clever and coupled" tradeoff, matching
      # this project's existing architecture conventions elsewhere.
      - name: Build and Push Versioned API Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.LOWER_IMAGE }}:${{ steps.version.outputs.version }}

      # EXPO_PUBLIC_API_URL/API_BASE_URL match the same real-domain value
      # used elsewhere in this workflow (see the `deploy` job's identical
      # build-args) — see k8s/configmap.yaml.
      - name: Build and Push Versioned Site Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./site/Dockerfile
          push: true
          build-args: |
            EXPO_PUBLIC_API_URL=https://api.skillstreak.xyz
            API_BASE_URL=https://api.skillstreak.xyz
            TRY_IT_URL=https://try.skillstreak.xyz
            EXPO_PUBLIC_JOIN_URL=https://skillstreak.xyz
            EXPO_PUBLIC_APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.LOWER_SITE_IMAGE }}:${{ steps.version.outputs.version }}

  internal-images:
    name: Build and Push Internal Test Images
    runs-on: ubuntu-latest
    # `review` only ever deploys to the internal microk8s cluster on
    # ubuntu01 (192.168.55.x, no public DNS/TLS) — never the public
    # isstech-2 cluster, which only ever runs what's built from `main` (see
    # the `deploy`/`release` jobs above). This job's only reason to exist:
    # site/Dockerfile bakes API_BASE_URL/TRY_IT_URL/etc. into the image at
    # build time, so the internal cluster needs its OWN image tagged with
    # its own LAN addresses — reusing a `main`-built image would silently
    # ship the public skillstreak.xyz URLs to a tester on the internal
    # network (confirmed happening in practice before this job existed:
    # ubuntu01 was running a site image built for the public domain).
    # tools/local-release-poller/poll-and-deploy.sh is what actually
    # deploys these — it polls this branch's latest commit, not this job
    # directly; this job's only responsibility is to make the
    # prerelease-<sha> images exist on GHCR for it to find.
    #
    # The `prerelease-` tag prefix is kept even though the branch is now
    # `review` (the `prerelease` branch was deleted 2026-08-10, with
    # `review` taking over as the single integration branch). It names the
    # BUILD CHANNEL — "an internal pre-release build" — not the branch, and
    # keeping it means the images already on GHCR, the version string a
    # running pod reports at /health, and the poller's tag construction all
    # stay valid. Rename it only together with
    # tools/local-release-poller/poll-and-deploy.sh, which is installed on
    # ubuntu01 and has to be re-copied there by hand.
    needs: [backend-test, compose-smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/review'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Downcase repository owner for Docker
        run: |
          echo "LOWER_IMAGE=ghcr.io/${OWNER,,}/skillstreak-api" >> "$GITHUB_ENV"
          echo "LOWER_SITE_IMAGE=ghcr.io/${OWNER,,}/skillstreak-site" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args needed — the api image never bakes in any URL, it
      # reads APP_PUBLIC_URL/CORS_ORIGIN/etc. from the ConfigMap at
      # runtime (ubuntu01's own k8s/configmap.yaml equivalent already
      # points at its own 192.168.55.x addresses, applied by hand — see
      # k8s/README.md). Tagged prerelease-<sha> so the poller can tell
      # this apart from main's github.sha-tagged and vX.Y.Z-tagged images.
      - name: Build and Push Internal API Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            APP_VERSION=prerelease-${{ github.sha }}
          tags: ${{ env.LOWER_IMAGE }}:prerelease-${{ github.sha }}

      # These four addresses are ubuntu01's own metallb LoadBalancer IPs
      # (api=192.168.55.71, site=192.168.55.72) — see k8s/README.md and
      # skillstreak-config's live values on that cluster. try-it has no
      # hostname to route by on a bare LAN IP, so it's served on its own
      # port (site/nginx.conf's second server block, listen 8081) instead
      # of a Host-header vhost like the public deployment uses.
      - name: Build and Push Internal Site Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./site/Dockerfile
          push: true
          build-args: |
            EXPO_PUBLIC_API_URL=http://192.168.55.71
            API_BASE_URL=http://192.168.55.71
            TRY_IT_URL=http://192.168.55.72:8081
            EXPO_PUBLIC_JOIN_URL=http://192.168.55.72
            EXPO_PUBLIC_APP_VERSION=prerelease-${{ github.sha }}
          tags: ${{ env.LOWER_SITE_IMAGE }}:prerelease-${{ github.sha }}
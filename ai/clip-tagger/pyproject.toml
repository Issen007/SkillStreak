[project]
name = "clip-tagger"
version = "0.1.0"
description = "Zero-shot training-type tagging for SkillStreak clips, from sampled frames"
requires-python = ">=3.11"

# Deliberately small. Every dependency here runs on a GPU cluster that
# holds children's derived video frames in memory, so the list is short
# enough for one person to review in full.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.17",  # multipart/form-data, per the contract
  "pillow>=11.0",
  "pyyaml>=6.0",
  # The worker calls the app cluster (pull topology). A main dependency,
  # not a dev one, since it is now on the production path.
  "httpx>=0.27",
]

[project.optional-dependencies]
# The real model backend. Split out so tests, CI and a laptop can run the
# service and exercise every code path except inference without pulling
# ~2.5 GB of torch wheels.
model = [
  "torch>=2.5",
  "transformers>=4.46",
  # SigLIP's tokenizer is SentencePiece-backed and transformers does not
  # pull it in. Without it `AutoProcessor.from_pretrained` raises at load,
  # which the Dockerfile's weight-baking step would have turned into a
  # failed build — but only after someone waited for a 2.5 GB image to get
  # that far. Found by running the model instead of assuming it.
  "sentencepiece>=0.2",
  "protobuf>=5.28",
]

# The Stage 0b harness. Separate from `model` because evaluation needs
# something the service does not: ffmpeg, to turn fixture videos into
# frames. Production never needs it here — the BACKEND samples frames and
# posts them — so it would be dead weight in the runtime image.
#
# `imageio-ffmpeg` ships a static binary as a wheel, which keeps this
# installable with uv alone (ADR-0003) instead of "and also apt-get
# install ffmpeg", which is the kind of undocumented step that makes a
# tool nobody runs.
eval = [
  "imageio-ffmpeg>=0.5",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "respx>=0.22",       # HTTP mocking for the worker loop
  "ruff>=0.8",
]

# torch must match the DRIVER on the GPU nodes, not the newest available.
#
# The default PyPI wheel is built for CUDA 13.0. These nodes run driver
# 570.211.01, which tops out at CUDA 12.8 — so `torch.cuda.is_available()`
# returned False, the tagger fell back to CPU, and it did so **silently**:
# the pod was Running, /health said `gpu: false`, and clips were being
# tagged correctly the whole time, just ~1.3s each on a CPU in a cluster
# bought for its GPUs. Nothing failed, which is exactly why it needed
# looking for.
#
# cu128 is the newest build the current driver accepts. If the nodes are
# ever upgraded this pin can move forward; if the driver moves BACKWARD
# this breaks loudly at model load, which is the right direction to fail.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clip_tagger"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

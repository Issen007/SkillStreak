# clip-tagger — the video training-type analyser, as a PULL worker.
#
# docs/design/gpu-video-tagging-architecture.md, Decisions 4 and 12, with
# Decision 9's call direction inverted per the owner's choice of option 2
# (2026-08-12): this cluster has no public address, so the worker reaches
# out to `api.skillstreak.xyz` instead of being called.
#
# The consequence is visible in this file: **there is no Service and no
# ingress**, because nothing ever connects to this pod. Its only network
# behaviour is outbound HTTPS to one host.
#
# Apply only after asserting cluster-identity, per this directory's README.
# The image tag is a placeholder rewritten by the CI job that builds it;
# it is deliberately not `latest`, so what is running can always be traced
# to a commit.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clip-tagger
  namespace: skillstreak-ai
  labels:
    app: clip-tagger
spec:
  # One replica. The workload is a scheduled sweep, not user traffic, and
  # a second pod would pin a second GPU and a second copy of the weights
  # for throughput nothing is currently asking for. Also keeps the
  # per-process rate limit meaning what it says (see main.py).
  replicas: 1
  selector:
    matchLabels:
      app: clip-tagger
  strategy:
    # Recreate, not RollingUpdate: two pods would need two GPUs during
    # every rollout, and there are three in the cluster with one currently
    # NotReady. A few seconds of downtime on an advisory, retried,
    # batch-driven feature costs nothing.
    type: Recreate
  template:
    metadata:
      labels:
        app: clip-tagger
    spec:
      # Without this the pod runs happily and cannot see the GPU — the
      # symptom is a CPU-speed model and `gpu: false` at /health, not a
      # crash. See k8s-ai/README.md.
      runtimeClassName: nvidia
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clip-tagger
          image: ghcr.io/issen007/skillstreak-clip-tagger:PLACEHOLDER_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The worker loop, not the HTTP service. Same image, same
          # scoring core — only the entrypoint differs, so a topology
          # change never means a second model implementation.
          command: ["uv", "run", "python", "-m", "clip_tagger.worker"]
          env:
            - name: CLIP_TAGGER_BACKEND
              value: siglip
            - name: CLIP_TAGGING_API_URL
              valueFrom:
                configMapKeyRef:
                  name: clip-tagger
                  key: CLIP_TAGGING_API_URL
            # The credential this cluster holds for the app cluster. The
            # one thing here worth protecting: it is a bearer token for an
            # endpoint that returns derived frames of children's clips.
            - name: CLIP_TAGGING_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clip-tagger
                  key: CLIP_TAGGING_WORKER_TOKEN
            # SERVICE_VERSION is baked at build (see the Dockerfile) so it
            # cannot drift from the image it describes. Not set here.
          resources:
            requests:
              nvidia.com/gpu: 1
              # Host RAM is the binding constraint on these nodes (~7.6 GB
              # allocatable), not GPU cores. Requesting more than half of
              # it would make the pod unschedulable alongside anything
              # else.
              memory: 3Gi
              cpu: "1"
            limits:
              nvidia.com/gpu: 1
              memory: 5Gi
              cpu: "3"
          volumeMounts:
            # readOnlyRootFilesystem means the process still needs
            # somewhere to put temporary files. Both are emptyDir, so
            # nothing survives the pod — which is the "retains nothing"
            # property, enforced by the filesystem rather than promised by
            # the code.
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/tagger/.cache
          # No HTTP probes: this pod serves nothing. Liveness is
          # "the process is running", which is what the restartPolicy
          # already gives. A probe here would need an HTTP server whose
          # only purpose was to be probed — and that server would be a
          # listening socket in a cluster whose whole security story is
          # that nothing listens.
          #
          # The worker refuses to start without its URL and token, so a
          # misconfigured pod crash-loops visibly rather than idling.
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
# The control that makes "retains nothing, reaches nothing" checkable
# rather than merely stated (Decision 4).
#
# Egress denied entirely, with one exception for cluster DNS. A successful
# exploit of an image-decode CVE therefore lands in a pod that can neither
# persist anything nor phone home with it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clip-tagger
  namespace: skillstreak-ai
spec:
  podSelector:
    matchLabels:
      app: clip-tagger
  policyTypes:
    - Ingress
    - Egress
  # No ingress rules at all: nothing connects to this pod, so every
  # inbound connection is unwanted by definition. This is stricter than the
  # push topology could ever have been, and is the one security win the
  # inversion actually buys.
  ingress: []
  egress:
    # DNS, so the API's hostname resolves.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS out, for the one host this worker talks to.
    #
    # **This is as narrow as a NetworkPolicy can express it**: Kubernetes
    # NetworkPolicy selects on IP blocks, not hostnames, and
    # `api.skillstreak.xyz` sits behind an address that can change. Pinning
    # a CIDR here would break the feature silently the next time it moves.
    # Restricting to 443 is therefore the real bound, and a compromised pod
    # could reach other HTTPS hosts — stated rather than papered over. If
    # that becomes unacceptable, the answer is an egress proxy with an
    # allow-list, not a CIDR that rots.
    - ports:
        - port: 443
          protocol: TCP

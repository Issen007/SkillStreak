# plan-generator — the coach training-plan LLM (ADR-0028 Phase 1).
#
# A second Deployment beside clip-tagger, sharing the image and sharing
# nothing else. Separate token, separate ConfigMap keys, separate GPU —
# so the two features are independently enable-able and a leak of one
# credential is not a leak of both (ADR-0028 Decision 10).
#
# Like the tagger it PULLS: this cluster has no inbound route, so it asks
# api.skillstreak.xyz for work. No Service, no port, `ingress: []`.
#
# It holds no corpus. The drills arrive with each job, keeping the single
# copy in the app's repository where it is reviewable in a diff and still
# exists if this cluster does not (Decision 14).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plan-generator
  namespace: skillstreak-ai
  labels:
    app: plan-generator
spec:
  # One replica, one GPU. Three A2s exist; the tagger holds one, this
  # holds one, and the third is headroom rather than a second replica —
  # a coach waiting 30s does not need parallelism, and the binding
  # constraint on these nodes is host RAM, not GPU count.
  replicas: 1
  selector:
    matchLabels:
      app: plan-generator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: plan-generator
    spec:
      runtimeClassName: nvidia
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plan-generator
          image: ghcr.io/issen007/skillstreak-clip-tagger:PLACEHOLDER_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["/app/.venv/bin/python", "-m", "clip_tagger.plan_generator"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: TRAINING_PLAN_API_URL
              valueFrom:
                configMapKeyRef:
                  name: plan-generator
                  key: TRAINING_PLAN_API_URL
            - name: TRAINING_PLAN_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: plan-generator
                  key: TRAINING_PLAN_WORKER_TOKEN
            # Baked into the image, like the tagger's. Overridable only
            # to point at another model already present in the image —
            # naming one that is not there fails at load rather than
            # downloading it, which is the intended behaviour now that
            # egress no longer allows a fetch.
            - name: TRAINING_PLAN_MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: plan-generator
                  key: TRAINING_PLAN_MODEL_ID
                  optional: true
            # No HF_HOME override, deliberately.
            #
            # The image bakes both models into /opt/hf-cache and sets
            # HF_HOME to match. This manifest used to point HF_HOME at the
            # emptyDir cache volume instead — correct when the weights
            # were downloaded at boot, and fatal once they were baked: it
            # aimed transformers at an empty directory, so it tried to
            # download, HF_HUB_OFFLINE=1 refused, and the pod crash-looped
            # with "couldn't connect to huggingface.co" again.
            #
            # The clip-tagger container has never set HF_HOME, which is
            # precisely why it kept working through the same change.
            # No HF_HUB_OFFLINE override any more: the LM is baked into
            # the image alongside the tagger's model, so the image's
            # HF_HUB_OFFLINE=1 is now correct for both containers. The
            # override existed because it was not, and that mismatch
            # crash-looped this pod twice.
          resources:
            requests:
              nvidia.com/gpu: 1
              # A 3B model in bfloat16 is ~6 GB of VRAM, comfortably
              # inside the A2's 15 GB. Host RAM is the tighter budget on
              # these nodes (~7.6 GB allocatable) and is what this
              # request is really about.
              memory: 4Gi
              cpu: "1"
            limits:
              nvidia.com/gpu: 1
              memory: 6Gi
              cpu: "3"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/tagger/.cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          # Weights land here on first start. emptyDir means they are
          # re-fetched on every reschedule — acceptable for now, and the
          # thing to swap for a PVC if rollouts become frequent.
          emptyDir:
            sizeLimit: 20Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plan-generator
  namespace: skillstreak-ai
spec:
  podSelector:
    matchLabels:
      app: plan-generator
  policyTypes:
    - Ingress
    - Egress
  # Nothing connects to this pod. Same as the tagger.
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # 443 out, for the job queue and nothing else. This used to be
    # broader — the pod also needed to reach the model host to download
    # weights — and baking them is what allowed it to narrow. Still not
    # host-restricted, because NetworkPolicy selects on IP blocks and
    # api.skillstreak.xyz's address can move; an egress proxy with an
    # allow-list is the remedy if that becomes unacceptable, not a CIDR
    # that rots.
    - ports:
        - port: 443
          protocol: TCP

# NestJS API, built from backend/Dockerfile.
#
# `image: ` below is a PLACEHOLDER. Building that
# Dockerfile and pushing the result to a registry the cluster can pull from
# (e.g. GHCR, Docker Hub, a private registry) is a CI/CD step not covered by
# these manifests — swap in the real `registry/repo:tag` before applying
# this file, and prefer an immutable tag (git SHA or version) over `latest`
# once that pipeline exists so rollouts are reproducible/reversible.
#
# KNOWN LIMITATION: backend/docker-entrypoint.sh runs TypeORM migrations on
# every container start before the app boots (see docs/adr/0002-data-model.md
# — schema changes go through migrations, never manual edits). That's fine
# with docker-compose's single api container, but two concurrent replicas
# running `migration:run` on the same rollout was exactly what stalled the
# first real alpha deploy on the cluster (rollout stuck at "1 out of 2 new
# replicas" until the progress deadline). replicas is 1 here as a direct
# result of hitting that, not just a theoretical precaution — go back to 2
# only once migrations are moved into a separate Job/init step with locking
# (not solved in this cut).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: skillstreak
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # node:22-alpine's built-in `node` user
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image:  # PLACEHOLDER — see comment above
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: skillstreak-config
          env:
            # Individual Postgres pieces — docker-entrypoint.sh assembles
            # DATABASE_URL from these at container start (with proper
            # URL-encoding of user/password) rather than a raw
            # $(POSTGRES_USER):$(POSTGRES_PASSWORD)@... string interpolated
            # here, since a real generated password can contain characters
            # that aren't valid unescaped in a URL (this broke every
            # deploy with "Invalid URL" until fixed — see that script's
            # comment). The API itself still only ever reads DATABASE_URL
            # (see backend/src/config/env.validation.ts).
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: skillstreak-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: skillstreak-config
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: JWT_SECRET
            - name: PII_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: PII_ENCRYPTION_KEY
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: SMTP_PASSWORD
            # Fas 3 (docs/adr/0010-video-storage-and-serving.md) — MinIO
            # credentials. MINIO_ENDPOINT/BUCKET/CLIP_* come from the
            # ConfigMap via envFrom above.
            #
            # Deliberately a scoped, non-root user (security-reviewer
            # finding, 2026-07-30) — read/write/delete/list on the `clips`
            # bucket only, no admin/service-info access, no other-bucket
            # visibility. A compromised api process can no longer reach
            # every team's video via MinIO's root credentials. See
            # k8s/README.md's MinIO section for how this user/policy was
            # created and how to recreate it if ever rotated.
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: MINIO_CLIPS_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: MINIO_CLIPS_SECRET_KEY
            # docs/adr/0023-pt-role-and-staff-sso-rbac.md Part B — staff
            # (admin/PT) SSO/RBAC. See k8s/secret.yaml.example for what
            # each of these holds; STAFF_COOKIE_SECURE comes from the
            # ConfigMap via envFrom above, not here (non-secret).
            #
            # STAFF_JWT_SECRET is required (env.validation.ts) — no
            # `optional: true` here, same as JWT_SECRET/PII_ENCRYPTION_KEY
            # above: a pod should fail fast and loudly (an
            # "Invalid environment configuration" boot error) rather than
            # silently boot with signing disabled. The five OAuth-credential
            # keys and ADMIN_EMAILS below ARE `optional: true` deliberately
            # — the project owner still has to register each real OAuth
            # application separately, so the Secret genuinely won't have
            # these keys yet on first deploy of this ADR's work, and
            # without `optional: true` a *missing key* (not just an empty
            # value) makes kubelet refuse to start the container at all
            # (CreateContainerConfigError), unlike every other required key
            # in this file. A login attempt for a provider left unset fails
            # with a clear error at request time instead (see
            # StaffOidcClientsService.requireEnv) — that's the intended
            # degrade, not a boot-time crash.
            - name: STAFF_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: STAFF_JWT_SECRET
            - name: ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: ADMIN_EMAILS
                  optional: true
            - name: GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: GOOGLE_OAUTH_CLIENT_ID
                  optional: true
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: GOOGLE_OAUTH_CLIENT_SECRET
                  optional: true
            - name: MICROSOFT_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: MICROSOFT_OAUTH_CLIENT_ID
                  optional: true
            - name: MICROSOFT_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: MICROSOFT_OAUTH_CLIENT_SECRET
                  optional: true
            - name: APPLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: APPLE_OAUTH_CLIENT_ID
                  optional: true
            - name: APPLE_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: APPLE_TEAM_ID
                  optional: true
            - name: APPLE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: APPLE_KEY_ID
                  optional: true
            - name: APPLE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: APPLE_PRIVATE_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

# Single-instance Postgres, matching docker-compose.yml's postgres:18-alpine.
# This is a Deployment (not a StatefulSet) because we're intentionally
# staying at one replica for MVP beta — no HA/replication yet. `Recreate`
# strategy avoids two pods ever trying to mount the same ReadWriteOnce PVC
# at once during a rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: skillstreak
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Security hardening, 2026-07-30. postgres:18-alpine's own entrypoint
      # already re-execs itself as the `postgres` user (uid 70) via gosu
      # when it starts as root — running non-root at the k8s level from the
      # very first instant just skips that internal re-exec (the `id -u`
      # check it gates on is simply already false), it doesn't fight it.
      # The one real risk is volume ownership: this PVC may have mixed
      # ownership from when every pod here ran as root, so an initContainer
      # unconditionally fixes it before the main container ever starts,
      # rather than assuming the existing ownership is already correct.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres:18-alpine's built-in `postgres` user
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-data-dir-ownership
          image: postgres:18-alpine
          command: ["sh", "-c", "chown -R 70:70 /var/lib/postgresql"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
      containers:
        - name: postgres
          image: postgres:18-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: skillstreak-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: skillstreak-config
                  key: POSTGRES_DB
          volumeMounts:
            # Postgres 18's image expects a single mount at
            # /var/lib/postgresql (not .../data) — see docker-compose.yml's
            # comment on this same change.
            - name: postgres-data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data

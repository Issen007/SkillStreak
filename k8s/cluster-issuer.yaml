# cert-manager ClusterIssuers for Let's Encrypt, solved via HTTP01 through
# the cluster's Cilium Gateway (see gateway.yaml) — no extra DNS-provider
# API credentials needed, since cert-manager just needs to answer an HTTP
# challenge on the same Gateway this app already uses.
#
# Solver type is `gatewayHTTPRoute`, not `ingress` — this cluster has no
# working ingress-nginx external path (see k8s/README.md's "External
# access" section for why Gateway API replaced it) and cert-manager needs
# to attach its own temporary HTTPRoute to skillstreak-gateway's `http`
# listener (no hostname restriction there, so any hostname's challenge
# can attach) to answer the challenge.
#
# Two issuers, on purpose: `letsencrypt-staging` first (untrusted-by-
# browsers certs, but no rate limits worth worrying about) to confirm the
# whole HTTP01 flow actually works — DNS resolves, the Gateway is
# reachable from the internet on :80, cert-manager can complete the
# challenge — before pointing real parents at this domain. Once a staging
# cert issues successfully (`kubectl describe certificate
# skillstreak-xyz-tls -n skillstreak` shows Ready), switch
# certificate.yaml's `issuerRef` to `letsencrypt-prod` and delete the
# now-stale Secret it created (cert-manager will re-issue a real one).
# Going straight to prod risks burning into Let's Encrypt's production
# rate limits (5 duplicate certs/week per exact set of hostnames) if
# anything's misconfigured on the first attempt.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # ACME expiry/problem notifications go here — must be a real,
    # monitored inbox, not a noreply address.
    email: christian.petersson@isstech.io
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: skillstreak-gateway
                namespace: skillstreak
                kind: Gateway
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: christian.petersson@isstech.io
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: skillstreak-gateway
                namespace: skillstreak
                kind: Gateway
                sectionName: http

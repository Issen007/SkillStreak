# Single-instance MinIO — the self-hosted S3-API object store for video
# clips (docs/adr/0010-video-storage-and-serving.md Decision 1). Deployed
# with the EXACT SAME Deployment+PVC+ClusterIP shape this repo already uses
# for Postgres (postgres-deployment.yaml/postgres-pvc.yaml/
# postgres-service.yaml) — no new deployment paradigm, no new PaaS
# capability required beyond what Postgres already proves works on this
# cluster (a ReadWriteOnce PVC bound to a single-replica stateful pod).
# `Recreate` strategy for the identical reason Postgres's Deployment uses
# it: avoids two pods ever trying to mount the same ReadWriteOnce PVC at
# once during a rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: skillstreak
  labels:
    app: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      # Security hardening, 2026-07-30. Unlike postgres, minio/minio's
      # image has no built-in non-root user and genuinely runs its PID 1
      # as root today (confirmed live) — no internal privilege-drop to
      # rely on, so this is a real behavior change, not just making an
      # existing drop mandatory. uid/gid 1000 is an arbitrary but fixed
      # choice (no clash with anything else in this namespace). The
      # initContainer fixes this PVC's existing root-owned data before the
      # main container, now permanently non-root, ever touches it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-data-dir-ownership
          # Pinned by digest, not `latest`.
          #
          # This stores children's video clips, and `latest` meant any pod
          # restart could silently move to a different MinIO build — no
          # manifest change, no review, and no way afterwards to say which
          # version had been running. Postgres and Redis were already pinned;
          # this was the one that was not.
          #
          # The digest is exactly what production was already serving on
          # 2026-08-21 (read from the running pod's imageID), so pinning it
          # changed nothing that day. To move it: pick the new release
          # deliberately, put its digest here, and deploy that as its own
          # change.
          image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: minio-data
              mountPath: /data
      containers:
        - name: minio
          # Pinned by digest, not `latest`.
          #
          # This stores children's video clips, and `latest` meant any pod
          # restart could silently move to a different MinIO build — no
          # manifest change, no review, and no way afterwards to say which
          # version had been running. Postgres and Redis were already pinned;
          # this was the one that was not.
          #
          # The digest is exactly what production was already serving on
          # 2026-08-21 (read from the running pod's imageID), so pinning it
          # changed nothing that day. To move it: pick the new release
          # deliberately, put its digest here, and deploy that as its own
          # change.
          image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secret
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: minio-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data

# Non-secret API configuration. Pair with secret.yaml (copied from
# secret.yaml.example) for the values that actually need to stay private.
#
# These are beta-deployment defaults mirroring backend/.env.example and
# docker-compose.yml — adjust per environment as needed (e.g. a real
# Postgres DB/user name instead of the dev-era "app_dev"/"app").
apiVersion: v1
kind: ConfigMap
metadata:
  name: skillstreak-config
  namespace: skillstreak
data:
  NODE_ENV: "production"
  PORT: "3000"
  POSTGRES_DB: "app_dev"
  # Not sensitive on its own — pairs with POSTGRES_PASSWORD in secret.yaml.
  POSTGRES_USER: "app"
  JWT_EXPIRES_IN: "180d"
  # smtp.gmail.com (not smtp-relay.gmail.com) — the relay endpoint requires
  # the sending IP to be allow-listed in the Workspace admin console, which
  # failed in practice ("550-5.7.0 Mail relay denied ... SMTP relay isn't
  # supported for unmanaged work accounts", confirmed live 2026-07-26).
  # smtp.gmail.com authenticates directly via the app-password in
  # secret.yaml's SMTP_PASSWORD, so it works from any sending IP. Same
  # port 587/STARTTLS, same user/pass auth (mail.service.ts unchanged).
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  # Must be the real SMTP_USER account (see k8s/secret.yaml.example) or a
  # verified Gmail "Send As" alias of it — a From address on a domain
  # Gmail isn't authenticated to send as gets silently spam-filtered by
  # the recipient's mail server (no bounce, no app-visible error; the
  # send call itself succeeds either way) rather than rejected outright.
  # Confirmed live 2026-07-29: this was still the placeholder domain
  # below while SMTP_USER was already a real noreply@isstech.io account —
  # every session-reissue email sent while that mismatch existed "sent"
  # successfully per the app's own logs but never reached a real inbox.
  SMTP_FROM: "SkillStreak <noreply@isstech.io>"
  # Real public domain (skillstreak.xyz, acquired 2026-07-28) via
  # skillstreak-gateway's TLS listeners — see gateway.yaml/certificate.yaml.
  # Parental-consent email links point here — this is still a TEST
  # deployment (see the "this is only a test" banners across the site/app),
  # so do NOT let real parent-facing emails go out until this domain is
  # confirmed Ready on letsencrypt-prod (not just letsencrypt-staging) —
  # see the warning in k8s/README.md about the consent token being a
  # bearer credential.
  APP_PUBLIC_URL: "https://api.skillstreak.xyz"
  # The site container's own embedded onboarding widget, and the try-it
  # app (a different origin — see site/nginx.conf), both call this API
  # cross-origin (GET /teams/invite, POST /players, plus every
  # Authorization-bearing endpoint the try-it app itself calls).
  CORS_ORIGIN: "https://skillstreak.xyz,https://www.skillstreak.xyz,https://try.skillstreak.xyz"
  # Fas 3 (docs/adr/0010-video-storage-and-serving.md) — the in-cluster
  # MinIO Service (minio-service.yaml), used only for the API's own
  # internal admin calls (bucket creation/policy).
  MINIO_ENDPOINT: "http://minio:9000"
  # MINIO_PUBLIC_ENDPOINT intentionally left unset here — presigned
  # upload/playback URLs need a real externally-reachable address (see
  # ADR-0010's 2026-07-26 addendum + minio-service.yaml's own comment),
  # which doesn't exist on this cluster yet (no working LoadBalancer, no
  # Ingress to MinIO's data port — same k8s/README.md gap blocking every
  # other external-access feature here). Video upload/playback are not
  # functional for a real client on this cluster until that's resolved;
  # set this once it is, alongside APP_PUBLIC_URL/CORS_ORIGIN above.
  MINIO_BUCKET: "clips"
  # Tunable product config (ADR-0010 Decision 5), not architecturally
  # fixed — see that ADR's own "flagged, not silently decided as final"
  # framing for these two numbers.
  CLIP_RETENTION_DAYS: "90"
  CLIP_PENDING_UPLOAD_TTL_MINUTES: "60"

# Non-secret API configuration. Pair with secret.yaml (copied from
# secret.yaml.example) for the values that actually need to stay private.
#
# These are beta-deployment defaults mirroring backend/.env.example and
# docker-compose.yml — adjust per environment as needed (e.g. a real
# Postgres DB/user name instead of the dev-era "app_dev"/"app").
apiVersion: v1
kind: ConfigMap
metadata:
  name: skillstreak-config
  namespace: skillstreak
data:
  NODE_ENV: "production"
  PORT: "3000"
  POSTGRES_DB: "app_dev"
  # Not sensitive on its own — pairs with POSTGRES_PASSWORD in secret.yaml.
  POSTGRES_USER: "app"
  JWT_EXPIRES_IN: "180d"
  # smtp.gmail.com (not smtp-relay.gmail.com) — the relay endpoint requires
  # the sending IP to be allow-listed in the Workspace admin console, which
  # failed in practice ("550-5.7.0 Mail relay denied ... SMTP relay isn't
  # supported for unmanaged work accounts", confirmed live 2026-07-26).
  # smtp.gmail.com authenticates directly via the app-password in
  # secret.yaml's SMTP_PASSWORD, so it works from any sending IP. Same
  # port 587/STARTTLS, same user/pass auth (mail.service.ts unchanged).
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  # Must be the real SMTP_USER account (see k8s/secret.yaml.example) or a
  # verified Gmail "Send As" alias of it — a From address on a domain
  # Gmail isn't authenticated to send as gets silently spam-filtered by
  # the recipient's mail server (no bounce, no app-visible error; the
  # send call itself succeeds either way) rather than rejected outright.
  # Confirmed live 2026-07-29: this was still the placeholder domain
  # below while SMTP_USER was already a real noreply@isstech.io account —
  # every session-reissue email sent while that mismatch existed "sent"
  # successfully per the app's own logs but never reached a real inbox.
  SMTP_FROM: "SkillStreak <noreply@isstech.io>"
  # Real public domain (skillstreak.xyz, acquired 2026-07-28) via
  # skillstreak-gateway's TLS listeners — see gateway.yaml/certificate.yaml.
  # Parental-consent email links point here — this is still a TEST
  # deployment (see the "this is only a test" banners across the site/app),
  # so do NOT let real parent-facing emails go out until this domain is
  # confirmed Ready on letsencrypt-prod (not just letsencrypt-staging) —
  # see the warning in k8s/README.md about the consent token being a
  # bearer credential.
  APP_PUBLIC_URL: "https://api.skillstreak.xyz"
  # The site container's own embedded onboarding widget, and the try-it
  # app (a different origin — see site/nginx.conf), both call this API
  # cross-origin (GET /teams/invite, POST /players, plus every
  # Authorization-bearing endpoint the try-it app itself calls).
  CORS_ORIGIN: "https://skillstreak.xyz,https://www.skillstreak.xyz,https://try.skillstreak.xyz"
  # Fas 3 (docs/adr/0010-video-storage-and-serving.md) — the in-cluster
  # MinIO Service (minio-service.yaml), used only for the API's own
  # internal admin calls (bucket creation/policy).
  # Safespring's real S3-compatible storage (2026-07-31), not the
  # self-hosted in-cluster MinIO — see docs/BACKLOG.md's "Object storage:
  # generic naming + provider-per-environment" entry for the full plan
  # (self-hosted MinIO stays in use on the internal test cluster only).
  # This one address is both the app's internal admin endpoint and the
  # one presigned URLs are signed against (ADR-0010's 2026-07-26 addendum)
  # — unlike the old self-hosted MinIO Service, there's no separate
  # cluster-internal-vs-public distinction here, Safespring's endpoint is
  # reachable both ways, so MINIO_PUBLIC_ENDPOINT is deliberately left
  # unset and falls back to this value (ObjectStorageService's
  # constructor). skillstreak-secret's MINIO_CLIPS_ACCESS_KEY/
  # MINIO_CLIPS_SECRET_KEY (still named after the old self-hosted
  # credential this replaces — the generic rename is a separate,
  # not-yet-designed task, see docs/BACKLOG.md) must now be real
  # Safespring S3 credentials, not the old self-hosted MinIO ones.
  MINIO_ENDPOINT: "https://s3a4.sto2.safedc.net"
  MINIO_BUCKET: "clips"
  # Tunable product config (ADR-0010 Decision 5), not architecturally
  # fixed — see that ADR's own "flagged, not silently decided as final"
  # framing for these two numbers.
  CLIP_RETENTION_DAYS: "90"
  CLIP_PENDING_UPLOAD_TTL_MINUTES: "60"
  # docs/adr/0023-pt-role-and-staff-sso-rbac.md Part B — renamed from
  # ADR-0022's (never-shipped) ADMIN_COOKIE_SECURE for consistency. "true"
  # here matches this file's own real-TLS deployment; ubuntu01's own
  # hand-applied ConfigMap (see k8s/README.md's "Internal test cluster"
  # section) must set this "false" instead — that cluster has no live TLS
  # at all, so a Secure-flagged cookie would silently never be sent there.
  STAFF_COOKIE_SECURE: "true"
  # Fas 5 (docs/adr/0020-usage-analytics-product-metrics.md) — the scheduled
  # aggregate-usage-report job's two non-secret knobs. The recipient address
  # itself is NOT here: it lives in skillstreak-secret alongside
  # ADMIN_EMAILS, for the same reason that entry gives (whose inbox receives
  # this is operationally sensitive even though an email address isn't a
  # cryptographic secret).
  #
  # Cadence (Decision 6): monthly, 06:00 on the 1st. Deliberately not one of
  # @nestjs/schedule's CronExpression constants — the ADR flags cadence as a
  # business judgment call the project owner should be able to change here
  # (weekly/quarterly) without a code change. A malformed value falls back to
  # this same default rather than crash-looping the pod.
  USAGE_REPORT_CRON: "0 6 1 * *"
  # Decision 3's security-reviewer-required minimum-population floor: the
  # fewest TEAMS a team-size bucket must contain before the report breaks a
  # metric out by team size at all. Below it, those teams are counted in the
  # app-wide number only — never shown as their own bucket, since a bucket
  # holding one or two teams can resolve to one specific child's behaviour.
  #
  # **5 is the reviewed value — don't lower it.** Raising it is always safe.
  # Anything below 5 is what the security review signed off against, so the
  # app logs a warning on every run that it's configured lower, and refuses
  # outright to go below 2 (a "bucket" of one team is the exact degenerate
  # case this floor exists to prevent). Lowering it needs a fresh
  # security-reviewer pass, not just an edit here.
  USAGE_REPORT_MIN_TEAMS_PER_BUCKET: "5"
  # docs/adr/0030-revocable-public-sharing-consent.md — which teams may
  # share clips outside their own team. Comma-separated team ids.
  #
  # **Empty means nobody, and that is the correct default.** This is a
  # rollout allow-list rather than a boolean because TestFlight builds use
  # the `production` EAS profile and therefore talk to this very cluster —
  # a plain on/off switch could not have told a tester from a real family,
  # so "on for testing" would have meant on for the whole beta.
  #
  # ADR-0030 finding 4 is CLOSED as of 2026-08-19 — the bounce mailbox
  # below gives the monthly reminder a real delivery signal, so Decision
  # 5's fail-closed disable can now actually fire on a dead parent
  # address. **That does not by itself mean this list should be widened.**
  # The allow-list also carries Decision 9's "small scale, among families
  # the coach knows" argument, and widening belongs with that review (due
  # 2026-09-16), not with finding 4's closure alone. Note also that the
  # disable only works while BOUNCE_IMAP_* below is actually configured.
  #
  # To enable a team: `kubectl -n skillstreak get pods` won't tell you the
  # id — query it (`SELECT id, name FROM team WHERE name = '...'`) and put
  # it here, then restart the api Deployment. Widening to everyone should
  # wait for finding 4 and Decision 9's review (due 2026-09-16).
  PUBLIC_SHARING_ENABLED_TEAM_IDS: ""

  # --- Bounce mailbox (ADR-0030 finding 4) ---------------------------------
  #
  # The IMAP mailbox that receives delivery-status notifications for mail
  # this app sends. `BounceMailboxService` polls it hourly, parses the
  # DSNs, and counts a permanent (5.x.x) failure for a monthly
  # public-sharing reminder toward Decision 5's disable.
  #
  # **Why this exists at all:** an asynchronous bounce is invisible to the
  # sending process. A relay accepts mail for a dead mailbox on a live
  # domain and bounces it later, out of band. Without this mailbox the
  # reminder sweep cannot tell a delivered reminder from one that vanished,
  # and a consent behind a dead parent address stays live forever.
  #
  # **Blank is a supported state, and a loud one.** The poll skips, and the
  # reminder sweep records a job failure on EVERY run naming how many
  # consents are running unsupervised — visible in the admin console. That
  # is deliberate: the ADR's objection to writing the sweep early was that
  # it "would report healthy while the case it exists to catch went
  # undetected", so the degraded state must never be quiet.
  #
  # BOUNCE_IMAP_PASSWORD is in the Secret, never here — this mailbox
  # accumulates live parental revoke codes, because a DSN quotes the
  # reminder that failed and that reminder carries the disable link. Give
  # it a dedicated account rather than pointing it at a shared inbox;
  # messages are deleted once read.
  #
  # **Verify what "deleted" means on the account you pick.** The poll
  # issues \Deleted + UID EXPUNGE. On Gmail/Workspace that removes the
  # INBOX label and leaves the message in All Mail unless the account is
  # set to "immediately delete forever" — and deletion is the entire
  # mitigation for this mailbox holding live revoke codes. Check it once,
  # at provisioning (security review 2026-08-19, finding 6).
  #
  # Environment parity: this is a per-cluster value like every other
  # address in this file. The internal test cluster should use its own
  # mailbox, not production's — a shared one would let a test bounce
  # disable a real family's consent.
  BOUNCE_IMAP_HOST: ""
  BOUNCE_IMAP_PORT: "993"
  BOUNCE_IMAP_USER: ""
  # Implicit TLS on 993. Only the literal `false` turns it off.
  BOUNCE_IMAP_SECURE: "true"
  BOUNCE_IMAP_MAILBOX: "INBOX"

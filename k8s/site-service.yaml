# ClusterIP — internal entry point for the site Pods. External access is
# via site-ingress.yaml, not by exposing this Service directly (same
# pattern as api-service.yaml).
apiVersion: v1
kind: Service
metadata:
  name: site
  namespace: skillstreak
  labels:
    app: site
spec:
  type: ClusterIP
  selector:
    app: site
  ports:
    - port: 80
      # Container listens on 8080, not 80 -- it runs as a non-root user
      # (security hardening, 2026-07-30) which can't bind a privileged
      # port. External consumers of this Service are unaffected: the
      # Service's own exposed port (above) is still 80.
      targetPort: 8080

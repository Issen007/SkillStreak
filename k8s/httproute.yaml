apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: skillstreak
  # Everything arriving on port 80 is bounced to HTTPS.
  #
  # **Why this exists**: reported 2026-08-20 by a visitor whose Safari
  # privacy report showed "Anslutningen ar inte krypterad" on
  # skillstreak.xyz. Port 80 was open and answering (envoy returned a
  # bare 404) with no redirect, so anyone typing the domain, following an
  # old http:// link, or scanning a QR code that omitted the scheme
  # landed on cleartext. The certificates were fine throughout. What was
  # missing was anything telling a browser to use the encrypted one.
  #
  # **This route DOES break HTTP-01 renewal. Read before switching back.**
  #
  # An earlier version of this comment claimed the opposite — that
  # Gateway API resolves by specificity, so cert-manager's Exact-path
  # /.well-known/acme-challenge/ route would still win. That is what the
  # spec says and it is not what Cilium v1.19.1 does. Measured 2026-08-20
  # with a probe route mimicking the solver exactly, using an Exact path
  # match AND a more specific hostname than this route: the ACME path
  # still answered 301, and the probe never appeared in the generated
  # CiliumEnvoyConfig at all. A catch-all RequestRedirect suppresses the
  # other routes on its listener instead of yielding to them.
  #
  # **Why it is safe to keep anyway**: cert-manager no longer uses
  # HTTP-01. cluster-issuer.yaml switched to DNS-01 via Cloudflare on
  # 2026-08-20, so renewal proves control of the zone by writing a TXT
  # record and never touches port 80. Verified end-to-end the same day: a
  # staging certificate for a hostname never issued before completed with
  # initialState=pending — a real challenge, not a cached authorization —
  # while this redirect was live on all four hostnames.
  #
  # So the constraint is one-directional and worth stating plainly: this
  # route is fine with DNS-01 and fatal with HTTP-01. Anything that moves
  # the issuers back to an http01 solver must delete this route in the
  # same change, or renewal will fail silently ~30 days before expiry —
  # and with HSTS now shipped, an expired cert is a hard outage users
  # cannot click past, not a warning page.
spec:
  parentRefs:
    - name: skillstreak-gateway
      # Pinned to the plaintext listener. Without sectionName this would
      # also attach to the HTTPS listeners and redirect them to
      # themselves — an infinite loop that looks like the site being down.
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            # 301, not 302: this is permanent, and a permanent redirect is
            # what lets a browser stop trying port 80 for this host at all.
            statusCode: 301
---
# Routes for skillstreak-gateway (see gateway.yaml). Each hostname here
# needs a matching listener on that Gateway for HTTPS (see gateway.yaml's
# listeners) — the `http` listener has no hostname restriction, so plain
# HTTP on any of these hostnames also works (and is what cert-manager's
# ACME HTTP01 challenge uses, see cluster-issuer.yaml).
#
# Only the real public skillstreak.xyz hostnames are listed — an earlier
# cluster (isstech-2) also carried its own internal PaaS testing hostnames
# (*.apps.isstech-2.paas.safedc.net) here; this cluster has a different
# internal hostname scheme and doesn't need an equivalent entry to
# function (those were a convenience for reaching the app before the real
# domain had DNS, not a requirement).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site-route
  namespace: skillstreak
spec:
  parentRefs:
    - name: skillstreak-gateway
  hostnames:
    - "skillstreak.xyz"
    - "www.skillstreak.xyz"
    - "try.skillstreak.xyz"
  rules:
    - backendRefs:
        - name: site
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: skillstreak
spec:
  parentRefs:
    - name: skillstreak-gateway
  hostnames:
    - "api.skillstreak.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api
          port: 80

# ---------------------------------------------------------------------------
# THE HTTP -> HTTPS REDIRECT LIVED HERE AND WAS REMOVED 2026-08-20.
#
# It worked. All four hostnames returned 301 to HTTPS. It was removed
# because it also, silently, breaks certificate renewal — which on this
# deployment is a worse outcome than the cleartext it fixed.
#
# WHAT WAS MEASURED, not assumed:
#
# cert-manager solves HTTP-01 by creating its own HTTPRoute with an Exact
# path match under /.well-known/acme-challenge/ on this same plaintext
# listener. Gateway API says a more specific match wins, so the challenge
# should survive a catch-all redirect. On Cilium v1.19.1 it does not.
#
# Tested by creating a route that mimics the solver exactly — same
# listener, Exact path match, and a MORE specific hostname than the
# redirect had. Result: the exact ACME path still answered 301, and the
# probe route was accepted (attachedRoutes went to 4) but was never
# programmed into the generated CiliumEnvoyConfig at all, even after two
# minutes. The generated config contained only `prefix: /` entries and the
# redirect. A catch-all RequestRedirect on a listener suppresses the other
# routes on it rather than yielding to them.
#
# WHY THAT MATTERS MORE THAN THE CLEARTEXT:
#
#   * renewal fires 2026-09-29, expiry 2026-10-29;
#   * the HSTS header now shipped (site/nginx.conf, backend/src/main.ts)
#     means users CANNOT click through an expired certificate;
#   * so a failed renewal is a hard outage, not a warning page.
#
# A staging-issuer test appeared to pass first and did not: Let's Encrypt
# returned `initialState=valid` from a cached authorization, so no
# challenge was ever solved. Those caches expire around mid-September,
# which is precisely why the real September renewal WOULD have hit this.
#
# HOW TO BRING IT BACK: once DNS-01 is in place, ACME stops needing port
# 80 at all and this becomes safe. Restoring it is `git revert` of the
# commit that removed it — the manifest was correct, its environment was
# not. See k8s/README.md's "TLS and certificate renewal" section.
#
# UNTIL THEN, plain HTTP answers 404 rather than redirecting. That is the
# state a visitor reported on 2026-08-20, and it is mitigated but not
# fixed by HSTS: a browser that has seen the site over HTTPS once will not
# try port 80 again, but a first-ever visit still starts in cleartext.
# ---------------------------------------------------------------------------

# Routes for skillstreak-gateway (see gateway.yaml). Each hostname here
# needs a matching listener on that Gateway for HTTPS (see gateway.yaml's
# listeners) — the `http` listener has no hostname restriction, so plain
# HTTP on any of these hostnames also works (and is what cert-manager's
# ACME HTTP01 challenge uses, see cluster-issuer.yaml).
#
# Only the real public skillstreak.xyz hostnames are listed — an earlier
# cluster (isstech-2) also carried its own internal PaaS testing hostnames
# (*.apps.isstech-2.paas.safedc.net) here; this cluster has a different
# internal hostname scheme and doesn't need an equivalent entry to
# function (those were a convenience for reaching the app before the real
# domain had DNS, not a requirement).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site-route
  namespace: skillstreak
spec:
  parentRefs:
    - name: skillstreak-gateway
  hostnames:
    - "skillstreak.xyz"
    - "www.skillstreak.xyz"
    - "try.skillstreak.xyz"
  rules:
    - backendRefs:
        - name: site
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: skillstreak
spec:
  parentRefs:
    - name: skillstreak-gateway
  hostnames:
    - "api.skillstreak.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api
          port: 80

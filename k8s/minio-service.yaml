# ClusterIP only — deliberately stays this way even now that MinIO has a
# public endpoint (2026-07-30). ADR-0010's 2026-07-26 addendum's "never
# LoadBalancer/NodePort/Ingress" reasoning was reversed for external
# *reachability* (presigned URLs need a real address a client can hit),
# but that's solved at the Gateway API layer instead — gateway.yaml's
# https-cdn listener + httproute.yaml's cdn-route terminate TLS and
# forward to this Service's `api` port (9000), same pattern as api/site.
# This Service itself never needs to change type; only Kubernetes objects
# in front of it changed.
# Includes the console port (9001) for `kubectl port-forward` admin
# debugging only — not routed by cdn-route, no reason to ever be
# externally reachable regardless of how the data port above is exposed.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: skillstreak
  labels:
    app: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

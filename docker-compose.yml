# Phase 0 scaffold: API + Postgres + Redis, wired up so `docker-compose up`
# brings all three up and the API's /health endpoint responds. No schema/
# migrations yet (Phase 1) — Postgres starts as an empty, credentialed
# instance only.
#
# Config comes from a root .env file — copy .env.example to .env first.
# Never hardcode credentials here.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # DATABASE_URL is assembled by docker-entrypoint.sh from these pieces
      # (with proper URL-encoding) rather than interpolated here directly —
      # a raw password can contain characters that aren't valid unescaped
      # in a URL. See that script's comment.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-180d}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-vNO0ZD2lT5+cyQfBdv8k338mQrgoYTFtnBfGi3mlgEE=}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      # Fas 3 (docs/adr/0010-video-storage-and-serving.md) — S3 object
      # storage for video clips, at Safespring like production. There is no
      # local object store any more (self-hosted MinIO was dropped on
      # 2026-10-09 when its image stopped being pullable from anywhere), so
      # set your own test-bucket keys in .env; compose refuses to start
      # without them rather than booting an API that cannot store clips.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-https://s3a4.sto2.safedc.net}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env to a test-bucket key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env to a test-bucket key}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET in .env to your test bucket}
      CLIP_RETENTION_DAYS: ${CLIP_RETENTION_DAYS:-90}
      CLIP_PENDING_UPLOAD_TTL_MINUTES: ${CLIP_PENDING_UPLOAD_TTL_MINUTES:-60}
      # docs/adr/0023-pt-role-and-staff-sso-rbac.md Part B. OAuth client
      # credentials are deliberately left unset here (no real applications
      # registered for local dev) — see backend/src/scripts/
      # mint-dev-staff-session.ts for testing everything downstream of
      # login without them.
      STAFF_JWT_SECRET: ${STAFF_JWT_SECRET:-dev-only-change-me-too}
      STAFF_COOKIE_SECURE: ${STAFF_COOKIE_SECURE:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      APPLE_OAUTH_CLIENT_ID: ${APPLE_OAUTH_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      # docs/adr/0020-usage-analytics-product-metrics.md (Fas 5) — the
      # scheduled aggregate-usage-report job. Unset recipient (the default
      # here) means the job no-ops with a log line, so a local stack never
      # tries to email anyone.
      USAGE_REPORT_RECIPIENT_EMAIL: ${USAGE_REPORT_RECIPIENT_EMAIL:-}
      CONTACT_RECIPIENT_EMAIL: ${CONTACT_RECIPIENT_EMAIL:-}
      USAGE_REPORT_CRON: ${USAGE_REPORT_CRON:-0 6 1 * *}
      USAGE_REPORT_MIN_TEAMS_PER_BUCKET: ${USAGE_REPORT_MIN_TEAMS_PER_BUCKET:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18's official image changed convention: a single mount at
      # /var/lib/postgresql (not .../data) so it can manage a
      # version-specific subdirectory itself (pg_ctlcluster-style), enabling
      # a future in-place major-version upgrade via `pg_upgrade --link`.
      # Mounting at .../data (the pre-18 convention) makes the image refuse
      # to start. See https://github.com/docker-library/postgres/pull/1259.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No named volume: per docs/adr/0002-data-model.md, Redis here is a
    # cache/accelerator over Postgres, never the source of truth — it's
    # meant to be safe to lose and rebuild, so we don't pretend otherwise
    # by persisting it.

  lab-access:
    build:
      context: ./tools/lab-access
      dockerfile: Dockerfile
    # network_mode: host (Linux-only) instead of a published port: this
    # tool's whole job is auto-detecting the machine's real LAN IP via
    # os.networkInterfaces() so a phone on the same Wi-Fi can reach Expo.
    # Docker's default bridge network puts it in its own network
    # namespace instead, where it would only see the container's private
    # docker0/eth0 address -- and since that interface is *named* eth0,
    # this tool's own "looks like Wi-Fi" heuristic would silently treat it
    # as correct, handing out a QR code no phone could ever reach. Host
    # networking is what makes it see the same interfaces as when this
    # tool is run manually with `pnpm run dev`. Only this one small dev
    # tool uses host networking -- api/postgres/redis stay on the
    # isolated default bridge network.
    network_mode: host
    restart: unless-stopped
    # Standalone dev/demo tool (see tools/lab-access/README.md) -- it
    # tolerates the API or Expo not being up yet (shows a red status dot
    # instead), so it doesn't need to wait on api's healthcheck.

volumes:
  postgres_data:

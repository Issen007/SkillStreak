# Two virtual hosts in one container, distinguished by the Host header
# ingress-nginx passes through -- both skillstreak.app2.isstech.io (the
# marketing/product page) and try.skillstreak.app2.isstech.io (the hosted
# Expo web export) point at this same Service in k8s/site-ingress.yaml.
# Combined into one image/container purely to avoid duplicating a trivial
# static-file-serving Dockerfile twice -- there's no shared state or
# runtime coupling between the two.
#
# The marketing vhost is default_server (not the app vhost) so that a
# request with no matching Host header -- which is exactly what happens
# hitting this Service's bare IP directly, e.g. a local microk8s
# LoadBalancer IP with no real DNS pointed at it yet -- lands on the
# marketing page and its embedded "Kom igång" signup widget, not the bare
# Expo export. Confirmed live 2026-07-26: visiting the site's LAN IP
# directly landed on the app export instead of the marketing site before
# this swap. The app export is still reachable the same way it always
# was, just now via an explicit Host header instead of being the default.
server {
    # 8080, not 80 -- this container runs as a non-root user (security
    # hardening, 2026-07-30) which can't bind a privileged (<1024) port.
    # k8s/site-service.yaml still exposes the Service's own port 80
    # externally; only the container's internal listen port moved.
    listen 8080 default_server;
    server_name skillstreak.app2.isstech.io skillstreak.xyz www.skillstreak.xyz;
    root /usr/share/nginx/marketing;
    index index.html;

    # HSTS — tells a browser to use HTTPS for this host without asking.
    #
    # The redirect in k8s/httproute.yaml fixes the *second* request; this
    # fixes the first, which is the one an attacker on a cafe network
    # would want. Without it, typing "skillstreak.xyz" still begins as a
    # cleartext request that somebody else can answer.
    #
    # One year, and deliberately WITHOUT `preload`. Preloading ships the
    # domain inside browser binaries and is effectively irreversible on
    # any useful timescale — a reasonable thing to opt into later,
    # deliberately, not a side effect of a security fix.
    #
    # `includeSubDomains` is safe here because every hostname this project
    # serves (www, api, try) is already on the same certificate. It does
    # mean any FUTURE subdomain must have TLS from its first request —
    # worth knowing before adding, say, a staging host.
    #
    # `always` so it is sent on error responses too; without it nginx
    # omits the header on 4xx/5xx, which are exactly the responses a
    # downgrade attack would produce.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Same three the API sets, for the same reasons — see backend/src/main.ts.
    # `nosniff` and `DENY` are unconditional; the marketing page is never
    # framed and nothing here should ever be sniffed. Referrer-Policy is the
    # milder `strict-origin-when-cross-origin` rather than the API's
    # `no-referrer`: this page carries deliberate outbound links (the demo,
    # the sponsors), and those hosts seeing which site sent the visitor is
    # wanted, while the path never is.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Revalidate every request rather than letting the browser guess.
    #
    # nginx sends no `Cache-Control` by default, only `Last-Modified` and
    # `ETag` — which puts the page under *heuristic* caching, where a
    # browser invents its own freshness window from the file's age. A
    # visitor can therefore keep seeing the previous deploy for an
    # unpredictable stretch, with nothing on either side saying so. That is
    # the exact shape of the confusion this project keeps paying for: what
    # is deployed and what a person is looking at quietly disagreeing.
    #
    # `no-cache` is not "do not cache" — the browser still stores the file
    # and still asks, so an unchanged asset costs a 304 with no body. None
    # of this content carries a content hash in its filename (index.html,
    # download.html, i18n.js are all served under fixed names), so
    # revalidation is the only thing that can make a deploy take effect.
    #
    # Deliberately in this block and not a separate `location` for assets:
    # in nginx, `add_header` in a child block discards every inherited
    # header, so an assets-only rule would silently drop HSTS and the three
    # above from every image and font on the site.
    add_header Cache-Control "no-cache" always;

    # Relative Location headers. nginx otherwise builds directory
    # redirects from server_name plus its own listen port, so
    # https://skillstreak.xyz/privacy answered with a 301 to
    # http://skillstreak.xyz:8080/privacy/ — the container's internal
    # port, and plain http, exposed to the public internet. Behind the
    # ingress that URL is dead. Caught by requesting the real path rather
    # than the directory form; /privacy/ worked throughout, which is
    # exactly why it would have shipped.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    # Also listens on 8081, unconditionally (no server_name match needed
    # on this port -- it's the only vhost bound here), so the try-it app
    # is reachable by a plain clickable link/IP:port with no Host-header
    # trick required. Added 2026-07-26: real domains route this vhost by
    # hostname via ingress in every deployment that has one, but a local
    # cluster's LoadBalancer IP has no hostname to route by, and an <a
    # href> can't set a custom Host header the way curl -H can -- so the
    # marketing page's "Öppna demot" link needs an actual distinct address
    # to point at locally. See site/Dockerfile's TRY_IT_URL build-arg.
    listen 8080;
    listen 8081;
    server_name try.skillstreak.app2.isstech.io try.skillstreak.xyz;
    root /usr/share/nginx/app;
    index index.html;

    # HSTS — tells a browser to use HTTPS for this host without asking.
    #
    # The redirect in k8s/httproute.yaml fixes the *second* request; this
    # fixes the first, which is the one an attacker on a cafe network
    # would want. Without it, typing "skillstreak.xyz" still begins as a
    # cleartext request that somebody else can answer.
    #
    # One year, and deliberately WITHOUT `preload`. Preloading ships the
    # domain inside browser binaries and is effectively irreversible on
    # any useful timescale — a reasonable thing to opt into later,
    # deliberately, not a side effect of a security fix.
    #

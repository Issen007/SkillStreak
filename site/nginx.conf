    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Revalidate every request rather than letting the browser guess.
    #
    # nginx sends no `Cache-Control` by default, only `Last-Modified` and
    # `ETag` — which puts the page under *heuristic* caching, where a
    # browser invents its own freshness window from the file's age. A
    # visitor can therefore keep seeing the previous deploy for an
    # unpredictable stretch, with nothing on either side saying so. That is
    # the exact shape of the confusion this project keeps paying for: what
    # is deployed and what a person is looking at quietly disagreeing.
    #
    # `no-cache` is not "do not cache" — the browser still stores the file

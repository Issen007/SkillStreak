<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillStreak — Staff</title>
<link rel="icon" href="/console/favicon.png">
<style>
  /* SkillStreak staff console — design tokens.
   *
   * Hand-written CSS, no framework: the console has no bundler and the
   * deployment blocks external stylesheets, so a design system here means
   * custom properties and discipline rather than a dependency.
   *
   * Dark mode is honoured rather than themed — an operator checking a
   * deploy at midnight should not be flashbanged. Everything below is
   * expressed in tokens so the dark block only restates colour, never
   * layout. */
  :root {
    color-scheme: light dark;

    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --ink: #16181d;
    --ink-2: #5b626d;
    --line: #e2e6ec;
    --accent: #2563eb;
    --accent-ink: #ffffff;
    --ok: #15803d;
    --warn: #a16207;
    --err: #dc2626;

    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
    --shadow-lg: 0 4px 12px rgba(16, 24, 40, .07);
    --sidebar-w: 208px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #171a20;
      --surface-2: #1e222a;
      --ink: #e8eaed;
      --ink-2: #9aa2ae;
      --line: #272c35;
      --accent: #5b8def;
      --accent-ink: #0b0d10;
      --ok: #4ade80;
      --warn: #fbbf24;
      --err: #f87171;
      --shadow: none;
      --shadow-lg: 0 4px 14px rgba(0, 0, 0, .4);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Every interactive element gets a visible focus ring. :focus-visible so
   * it appears for keyboard users without following every mouse click. */
  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ---- sign in ------------------------------------------------------ */
  .login { max-width: 340px; margin: 14vh auto; text-align: center; padding: 0 20px; }
  .login .mark {
    width: 44px; height: 44px; margin: 0 auto 18px; border-radius: 12px;
    background: linear-gradient(140deg, #f97316, #ef4444);
    display: grid; place-items: center; font-size: 22px;
  }
  .login h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: -.01em; }
  .login p { color: var(--ink-2); font-size: 13.5px; margin: 0 0 22px; }
  .sso {
    display: block; width: 100%; margin-bottom: 9px; padding: 11px 14px;
    font: inherit; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-sm); cursor: pointer; text-decoration: none;
    color: inherit; transition: border-color .15s, transform .15s;
  }
  .sso:hover { border-color: var(--accent); transform: translateY(-1px); }
  .note { font-size: 12.5px; color: var(--ink-2); margin-top: 18px; }

  /* ---- shell -------------------------------------------------------- */
  .shell { display: none; }
  .shell.is-on { display: grid; grid-template-columns: var(--sidebar-w) 1fr;
                 min-height: 100vh; }

  aside {
    background: var(--surface); border-right: 1px solid var(--line);
    padding: 16px 12px; position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; gap: 4px;
  }
  .brand {
    display: flex; align-items: center; gap: 9px; font-weight: 650;
    padding: 4px 8px 14px; letter-spacing: -.01em;
  }
  .brand .dot {
    width: 22px; height: 22px; border-radius: 7px; flex: none;
    background: linear-gradient(140deg, #f97316, #ef4444);
    display: grid; place-items: center; font-size: 12px;
  }

  nav { display: flex; flex-direction: column; gap: 2px; }
  nav button {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    font: inherit; font-size: 13.5px; padding: 8px 10px;
    border-radius: var(--radius-sm); border: 1px solid transparent;
    background: transparent; cursor: pointer; color: var(--ink-2);
    transition: background .12s, color .12s;
  }
  nav button:hover { background: var(--surface-2); color: var(--ink); }
  nav button.is-active {
    background: var(--surface-2); color: var(--ink); font-weight: 600;
    border-color: var(--line);
  }
  nav button .ico { width: 15px; text-align: center; flex: none; opacity: .85; }

  /* Admin / Trainer switch. A segmented control rather than a toggle: a
     toggle implies on/off, and neither of these is the absence of the
     other. */
  .mode {
    display: flex; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: 2px; margin: 0 2px 12px;
  }
  .mode button {
    flex: 1; font: inherit; font-size: 12.5px; padding: 5px 8px; cursor: pointer;
    border: none; background: transparent; color: var(--ink-2);
    border-radius: 6px; transition: background .12s, color .12s;
  }
  .mode button.is-on {
    background: var(--surface); color: var(--ink); font-weight: 600;
    box-shadow: var(--shadow);
  }

  .aside-foot { margin-top: auto; padding: 10px 8px 2px; border-top: 1px solid var(--line); }
  /* The button rules below are scoped to `main`, so the sidebar's own
     button needs saying explicitly — otherwise it renders as a raw
     browser button in the middle of a designed panel. */
  aside button.link {
    font: inherit; font-size: 12.5px; background: none; border: none;
    padding: 0; color: var(--ink-2); cursor: pointer; text-decoration: underline;
  }
  aside button.link:hover { color: var(--ink); }
  .who { font-size: 12.5px; color: var(--ink-2); display: block; margin-bottom: 6px; }
  .env {
    display: inline-block; font-size: 10.5px; font-weight: 700;
    letter-spacing: .06em; padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink-2);
  }
  .env.prod { color: var(--err); border-color: var(--err); }
  /* ADR-0031's one-line link result, appended next to the signed-in name
     and removed after a few seconds. Deliberately not a modal: it reports
     the outcome of something the operator already asked for, and the
     link grants nothing that would warrant interrupting them. */
  .linkNote { color: var(--ink-2); }

  main { padding: 26px 30px 70px; max-width: 1040px; }
  h2 { font-size: 20px; margin: 0 0 16px; letter-spacing: -.015em; }
  h3 { letter-spacing: -.01em; }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 17px 19px; margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  /* Player preview.
     Hard-coded colours and sizes, deliberately not the console's own
     tokens: these are mobile/src/theme/colors.ts and TipsScreen's own
     StyleSheet, and the preview is worthless if it drifts to match the
     console instead of the app. Changing the app's Tips screen means
     changing these to match — they are a copy, and copies need saying so.
     ink #1B1B3A, paper #FAFAF7, textMuted #6B6B85. */
  .phone {
    max-width: 380px; margin: 0 0 14px; padding: 12px;
    background: #2b2b33; border-radius: 34px;
  }
  .phone-screen {
    background: #FAFAF7; border-radius: 24px; padding: 16px;
    max-height: 60vh; overflow-y: auto;
  }
  .tips-head {
    font-size: 24px; font-weight: 700; color: #1B1B3A; margin: 0 0 4px;
  }
  .tips-intro { font-size: 14px; color: #6B6B85; margin: 0 0 16px; }
  .tip-card {
    background: #FFFFFF; border-radius: 16px; padding: 16px;
    margin-bottom: 12px;
  }
  .tip-title {
    font-size: 17px; font-weight: 700; color: #1B1B3A; margin: 0 0 2px;
  }
  .tip-byline { font-size: 13px; color: #6B6B85; margin: 0 0 10px; }
  /* pre-wrap so the trainer's own line breaks survive, matching how the
     app renders the body in a plain <Text>. */
  .tip-body {
    font-size: 15px; line-height: 22px; color: #1B1B3A; margin: 0;
    white-space: pre-wrap;
  }
  .tips-end {
    font-size: 13px; color: #6B6B85; text-align: center; margin: 8px 0 0;
  }
  .card.stub { border-style: dashed; box-shadow: none; }

  /* Stat tiles — the number is the content, so it gets the weight. */
  .tiles { display: grid; gap: 12px; margin-bottom: 14px;
           grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .tile {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
  }
  .tile .n { font-size: 26px; font-weight: 680; letter-spacing: -.02em;
             display: block; line-height: 1.15; }
  .tile .l { font-size: 12.5px; color: var(--ink-2); }

  /* A trainer's own tag on their own group. Reads as a label, not a
     button — nothing here is clickable, and looking clickable would
     promise a filter that doesn't exist. */
  .chip {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    background: var(--surface-2, var(--surface));
    border: 1px solid var(--line); color: var(--ink-2);
    font-size: 12px; line-height: 1.6;
  }

  .muted { color: var(--ink-2); font-size: 13.5px; }
  .err { color: var(--err); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; font-size: 11px; letter-spacing: .05em;
    text-transform: uppercase; color: var(--ink-2); font-weight: 600;
    padding: 7px 8px; border-bottom: 1px solid var(--line);
  }
  td { padding: 9px 8px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td, table tr:hover td { background: var(--surface-2); }

  main button, .btn {
    font: inherit; font-size: 13.5px; padding: 7px 13px; cursor: pointer;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--ink);
    transition: border-color .12s, background .12s, transform .12s;
  }
  main button:hover:not(:disabled) { border-color: var(--accent); }
  main button:active:not(:disabled) { transform: translateY(1px); }
  main button:disabled { opacity: .5; cursor: default; }
  main button.primary {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    font-weight: 550;
  }
  main button.primary:hover { filter: brightness(1.08); }
  main button.link { border: none; padding: 0; background: none; color: var(--accent);
                     text-decoration: underline; }

  input, select, textarea {
    font: inherit; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: var(--radius-sm); background: var(--surface);
    color: var(--ink); width: 100%;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  /* Checkboxes are the one input that must not stretch. The width:100%
     above was written for text fields; applied to a checkbox it drives the
     box to one end of the row and its words to the other. Nothing in this
     console used a checkbox until drill groups, so the rule had never been
     wrong before. */
  input[type="checkbox"], input[type="radio"] {
    width: auto; padding: 0; margin: 0; accent-color: var(--accent);
  }
  label { display: block; font-size: 13px; color: var(--ink-2); }

  /* Hover/focus explainer. A <details>-free, JS-free tooltip: the marker is
     a real <button> so it is keyboard reachable and screen-reader
     announced, not a bare span with a title attribute. */
  .info { position: relative; display: inline-block; margin-left: 5px; }
  .info > button {
    width: 15px; height: 15px; line-height: 13px; padding: 0; font-size: 10.5px;
    border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2);
    color: var(--ink-2); cursor: help; font-weight: 700;
  }
  .info > span {
    position: absolute; left: 50%; bottom: calc(100% + 7px);
    transform: translateX(-50%); width: 268px; padding: 10px 12px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
    font-size: 12.5px; line-height: 1.5; font-weight: 400; text-align: left;
    opacity: 0; visibility: hidden; transition: opacity .12s; z-index: 20;
    pointer-events: none;
  }
  .info:hover > span, .info > button:focus-visible + span { opacity: 1; visibility: visible; }

  .badge {
    display: inline-block; font-size: 11.5px; padding: 2px 9px;
    border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2);
    white-space: nowrap; font-weight: 550;
  }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.accent { color: var(--accent); border-color: var(--accent); }

  /* Narrow screens: the sidebar becomes a scrolling top strip. A 208px
   * column on a phone would leave nothing for the content it exists to
   * navigate. */
  @media (max-width: 720px) {
    .shell.is-on { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: none;
            border-bottom: 1px solid var(--line); }
    nav { flex-direction: row; overflow-x: auto; gap: 4px; }
    nav button { white-space: nowrap; }
    .aside-foot { margin-top: 12px; }
    main { padding: 20px 16px 60px; }
  }

  /* Respect a stated preference for less motion — every transition here is
   * decoration, so there is nothing to lose by dropping them. */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<!-- AD0' — the sign-in screen. Three SSO buttons and nothing else: there is
     no password to collect, and no role picker, because the role is derived
     server-side from ADMIN_EMAILS rather than chosen by whoever signs in. -->
<section class="login" id="login">
  <div class="mark">🔥</div>
  <h1>SkillStreak — Staff</h1>
  <p>Admin and trainer console</p>
  <!-- Filled from GET /staff-auth/providers, so only providers with a
       registered OAuth application are offered. These used to be three
       hardcoded links while only Google was registered, so two of them
       led to a 500 and wrote an error-log row on every click. The
       server still refuses an unconfigured provider on its own — this is
       the dead end removed, not the check. -->
  <div id="ssoButtons"></div>
  <p class="note" id="loginNote">You need an account that already has access.</p>
</section>

<div class="shell" id="shell">
  <aside>
    <span class="brand"><span class="dot">🔥</span>SkillStreak</span>
    <div id="modeSwitch" style="display:none"></div>
    <nav id="nav"></nav>
    <div class="aside-foot">
      <span class="who" id="who"></span>
      <div class="mode" id="langSwitch" style="margin:0 0 8px"></div>
      <span class="env" id="env">—</span>
      <button class="link" id="logout" style="display:block;margin-top:10px;font-size:12.5px">Sign out</button>
    </div>
  </aside>
  <main id="view"></main>
</div>

<script src="/console/app.js"></script>
</body>
</html>
